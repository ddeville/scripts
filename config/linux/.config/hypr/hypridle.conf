general {
    # Handle loginctl lock requests with a single hyprlock instance.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session "$XDG_SESSION_ID"
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # DPMS controls display power; turn screens off only after locking.
    on_lock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    # Hold the sleep inhibitor until the lock screen reports that it is ready.
    inhibit_sleep = 3
}

# Lock after ten idle minutes; activity wakes the displays without unlocking.
listener {
    timeout = 600
    on-timeout = loginctl lock-session "$XDG_SESSION_ID"
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
