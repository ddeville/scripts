general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
    }
}

animations {
    enabled = false
}

# An empty monitor selector applies widgets to every display.
background {
    monitor =
    path = /usr/share/backgrounds/lock
    color = rgb(405b73)
}

label {
    monitor =
    text = $TIME12
    color = rgb(ebdbb2)
    font_size = 48
    font_family = Noto Sans Mono
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    outer_color = rgb(fabd2f)
    inner_color = rgb(282828)
    font_color = rgb(ebdbb2)
    font_family = Noto Sans Mono
    fade_on_empty = false
    placeholder_text = Password
    rounding = 6
    position = 0, 0
    halign = center
    valign = center
}
