general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
    }
}

animations {
    enabled = false
}

# An empty monitor selector applies the background and password field to every display.
background {
    monitor =
    color = rgb(405b73)
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    outer_color = rgb(fabd2f)
    inner_color = rgb(282828)
    font_color = rgb(ebdbb2)
    font_family = Noto Sans Mono
    placeholder_text = Password
    rounding = 6
    position = 0, 0
    halign = center
    valign = center
}
