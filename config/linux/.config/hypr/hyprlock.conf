general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or enter password
    }
}

animations {
    enabled = false
}

# An empty monitor selector applies widgets to every display.
background {
    monitor =
    path = /usr/share/backgrounds/lock
    color = rgb(405b73)
}

shape {
    monitor =
    size = 480, 144
    color = rgba(282828dd)
    rounding = 12
    position = 0, -24
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] printf '%s\n' "$FPRINTPROMPT" | sed 's/^$/Enter your password/'
    color = rgb(ebdbb2)
    font_size = 14
    font_family = Noto Sans Mono
    position = 0, -60
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    outer_color = rgb(fabd2f)
    inner_color = rgb(282828)
    font_color = rgb(ebdbb2)
    font_family = Noto Sans Mono
    fade_on_empty = false
    placeholder_text = Password
    rounding = 6
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}
