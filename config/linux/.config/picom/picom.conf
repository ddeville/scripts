backend = "glx";
xrender-sync-fence = true;
vsync = true;

shadow = false;
fading = false;
corner-radius = 0;

blur-background = true;

blur:
{
  method = "dual_kawase";
  strength = 8;
};

rules = (
  # Keep opaque Ghostty windows opaque while GTK redraws after a desktop switch.
  # Remove these shader rules to use Ghostty's native background transparency.
  {
    match = "class_g = 'com.mitchellh.ghostty' && window_type = 'normal'";
    shader = "ghostty-opaque.glsl";
  },
  {
    match = "class_g = 'com.mitchellh.ghostty' && window_type = 'normal' && !(_GTK_THEME_VARIANT@ = 'dark')";
    shader = {
      path = "ghostty-opaque.glsl";
      defines = {
        FALLBACK_COLOR = "vec3(251.0, 241.0, 199.0) / 255.0";
      };
    };
  },
);
