[window]
dynamic_padding = true
option_as_alt = "Both"

[window.dimensions]
columns = 100
lines = 40

[window.padding]
x = 2
y = 2

[font]
size = 14

[font.offset]
y = 5

[font.glyph_offset]
y = 2

# On Linux, ctlr-c (obviously) doesn't copy and one has to use ctrl-shift-c. Since I bind ctrl to cmd when using Linux
# I'm too used to it so also map cmd-shift-{c,v} to copy and paste on macos too...
[[keyboard.bindings]]
key = "C"
mods = "Command|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Command|Shift"
action = "Paste"

# By default, on macos cmd-N calls CreateNewInstance
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"
