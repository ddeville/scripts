[background]
path = "/usr/share/backgrounds/login"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
theme_name = "Adwaita"
icon_theme_name = "Adwaita"
font_name = "Public Sans"

[appearance]
greeting_msg = "Select Login, then scan your fingerprint."

[widget.clock]
format = "%a %b %d %I:%M%p"
locale = "en_US"
